spring:
  application:
    name: url-shortner

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: pass123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
